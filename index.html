<!DOCTYPE html>
<html>
<head>
<title>Kavitha ❤️ Raju</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
margin:0;
height:100vh;
background:pink;
font-family:Arial;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
overflow:hidden;
}

.box{
background:white;
padding:30px;
border-radius:20px;
width:80%;
max-width:400px;
}

.hide{
display:none;
}

input{
padding:10px;
font-size:18px;
border-radius:10px;
}

button{
padding:12px 25px;
margin:10px;
border:none;
border-radius:20px;
background:#ff4b7d;
color:white;
font-size:18px;
}

.heart{
position:absolute;
font-size:25px;
animation:fall 4s linear infinite;
}

@keyframes fall{
from{top:-20px;}
to{top:100vh;}
}

</style>

</head>

<body>


<div id="first" class="box">

<h1>💌 Surprise ❤️</h1>

<p>Enter Your Name</p>

<input id="username">

<br>

<button onclick="next()">Continue ❤️</button>

</div>



<div id="second" class="box hide">

<h1 id="hello"></h1>

<h2>Will You Love Me Forever? ❤️</h2>

<button onclick="finalPage()">YES ❤️</button>

<button id="noBtn">NO 😜</button>

</div>



<div id="third" class="box hide">

<h1>❤️ My Love ❤️</h1>

<p>
I love you today, tomorrow and forever.<br><br>

Until my last breath, I will love you.<br><br>

Thank you for coming into my life baby.<br><br>

You are my love of my life ❤️
</p>


<h2>
Kavitha Puppala ❤️ Raju Puppala
</h2>
  <button onclick="alert('You are my forever love ❤️')">
One More Surprise 🎁
</button>


</div>



<script>


function next(){

var n=document.getElementById("username").value;

if(n==""){
alert("Please enter name ❤️");
return;
}


document.getElementById("first").classList.add("hide");

document.getElementById("second").classList.remove("hide");

document.getElementById("hello").innerHTML="Hi "+n+" ❤️";

}



function finalPage(){

document.getElementById("second").classList.add("hide");

document.getElementById("third").classList.remove("hide");

}



document.getElementById("noBtn").onmouseover=function(){

this.style.position="absolute";

this.style.left=Math.random()*80+"%";

this.style.top=Math.random()*80+"%";

}



function heart(){

var h=document.createElement("div");

h.className="heart";

h.innerHTML="❤️";

h.style.left=Math.random()*100+"%";

document.body.appendChild(h);


setTimeout(function(){
h.remove();
},4000);

}


setInterval(heart,500);


</script>


</body>
</html>
