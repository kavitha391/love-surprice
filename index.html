<!DOCTYPE html>
<html>
<head>
<title>Kavitha ❤️ Raju</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
margin:0;
height:100vh;
background:linear-gradient(135deg,#ff416c,#ffb6c1);
font-family:Arial;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
color:white;
text-align:center;
}

.box{
background:rgba(255,255,255,0.2);
padding:30px;
border-radius:25px;
width:85%;
max-width:400px;
}

input{
padding:12px;
border-radius:15px;
border:none;
font-size:18px;
}

button{
padding:12px 30px;
border:none;
border-radius:30px;
margin:10px;
font-size:18px;
background:white;
color:#ff3366;
cursor:pointer;
}

.page{
display:none;
}

.heart{
position:absolute;
font-size:25px;
animation:fall 5s linear infinite;
}

@keyframes fall{
from{
top:-10%;
}
to{
top:110%;
}
}

</style>

</head>

<body>


<div id="one" class="box">

<h1>❤️ Surprise For You ❤️</h1>

<h2>Enter Your Name</h2>

<input id="name">

<br>

<button onclick="start()">Continue ❤️</button>

</div>



<div id="two" class="box page">

<h1 id="welcome"></h1>

<h2>Will You Stay With Me Forever? ❤️</h2>

<button onclick="love()">YES ❤️</button>

<button id="no">NO 😜</button>

</div>



<div id="three" class="box page">

<h1>❤️ My Love ❤️</h1>

<p>

I love you today, tomorrow and forever.<br><br>

Until my last breath, I will love you.<br><br>

Thank you for coming into my life, baby.<br><br>

You are the love of my life ❤️

</p>

<h2>
Kavitha Puppala ❤️ Raju Puppala
</h2>

<h3>
Forever & Always 💖
</h3>

</div>



<script>

function hide(){

one.style.display="none";
two.style.display="none";
three.style.display="none";

}


function start(){

let n=document.getElementById("name").value;

if(n==""){
alert("Enter your name ❤️");
return;
}

hide();

two.style.display="block";

welcome.innerHTML="Hi "+n+" ❤️";

}


function love(){

hide();

three.style.display="block";

}



let no=document.getElementById("no");


no.onmouseover=function(){

no.style.position="absolute";

no.style.left=Math.random()*80+"%";

no.style.top=Math.random()*80+"%";

}



function hearts(){

let h=document.createElement("div");

h.className="heart";

h.innerHTML="❤️";

h.style.left=Math.random()*100+"%";

document.body.appendChild(h);


setTimeout(()=>{

h.remove();

},5000);

}


setInterval(hearts,500);
